<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clock Widget</title>
    <style>
      :root {
        --bg-1: #020b10;
        --bg-2: #0d1d2a;
        --panel: rgba(9, 22, 31, 0.4);
        --line: rgba(133, 234, 255, 0.24);
        --text: #ecf9ff;
        --muted: rgba(220, 240, 252, 0.72);
        --glow: rgba(123, 213, 255, 0.48);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .clock {
        position: relative;
        width: min(100%, 540px);
        padding: 1.5rem 1.75rem 1.1rem;
        border: 1px solid var(--line);
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(10, 25, 34, 0.68), rgba(5, 15, 22, 0.34));
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02), 0 0 24px rgba(71, 175, 220, 0.16);
        text-align: center;
      }

      .clock::before {
        content: "";
        position: absolute;
        inset: 10px;
        border: 1px solid rgba(167, 235, 255, 0.14);
        border-radius: 16px;
        pointer-events: none;
      }

      .time,
      .date {
        position: relative;
        z-index: 1;
      }

      .time {
        font-size: clamp(2.3rem, 6vw, 4.7rem);
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        text-shadow: 0 0 12px var(--glow), 0 0 24px rgba(103, 214, 255, 0.4);
      }

      .date {
        margin-top: 0.7rem;
        font-size: 0.72rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
      }

      @media (max-width: 420px) {
        .clock {
          padding: 1.2rem 1rem 0.9rem;
          border-radius: 18px;
        }

        .time {
          letter-spacing: 0.08em;
        }

        .date {
          letter-spacing: 0.12em;
        }
      }
    </style>
  </head>
  <body>
    <div class="clock" aria-live="polite">
      <div class="time" id="time">00:00:00</div>
      <div class="date" id="date">Monday, January 1, 2024</div>
    </div>

    <script>
      const timeEl = document.getElementById('time');
      const dateEl = document.getElementById('date');

      const defaultParams = {
        hour12: false,
        showSeconds: true,
        showDate: true,
        timezone: 'local'
      };

      function getTimeFormatter(params) {
        const hour12 = Boolean(params.hour12);
        const showSeconds = Boolean(params.showSeconds);

        return new Intl.DateTimeFormat('en-US', {
          hour: '2-digit',
          minute: '2-digit',
          second: showSeconds ? '2-digit' : undefined,
          hour12,
          timeZone: params.timezone && params.timezone !== 'local' ? params.timezone : undefined
        });
      }

      function getDateFormatter(params) {
        return new Intl.DateTimeFormat('en-US', {
          weekday: 'long',
          month: 'long',
          day: 'numeric',
          year: 'numeric',
          timeZone: params.timezone && params.timezone !== 'local' ? params.timezone : undefined
        });
      }

      function updateClock(params) {
        const now = new Date();
        const timeFormatter = getTimeFormatter(params);
        const dateFormatter = getDateFormatter(params);

        timeEl.textContent = timeFormatter.format(now);

        if (params.showDate !== false) {
          dateEl.textContent = dateFormatter.format(now);
        } else {
          dateEl.textContent = '';
        }
      }

      async function init() {
        let params = { ...defaultParams };

        if (window.mirror && typeof window.mirror.native?.getParams === 'function') {
          try {
            params = { ...defaultParams, ...(await window.mirror.native.getParams()) };
          } catch (error) {
            console.warn('Clock widget: failed to read params', error);
          }
        }

        updateClock(params);
        setInterval(() => updateClock(params), 1000);
      }

      init();

      if (window.mirror && window.mirror.host) {
        window.mirror.host.on('visibility', ({ visible }) => {
          document.body.style.opacity = visible === false ? '0.5' : '1';
        });
      }
    </script>
  </body>
</html>
