<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Spotify Now Playing</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="spotify-widget" aria-live="polite">
		<div class="cover-wrap">
			<img id="cover" class="cover" alt="" hidden>
			<div id="cover-placeholder" class="cover-placeholder" aria-hidden="true">♪</div>
		</div>

		<section class="track-info">
			<div class="eyebrow"><span class="spotify-mark" aria-hidden="true">●</span> Now playing</div>
			<h1 id="title">Nothing playing</h1>
			<p id="artist" class="artist">Connect Spotify to show your music</p>
			<p id="album" class="album"></p>
			<div class="progress" aria-hidden="true"><span id="progress-bar"></span></div>
			<div class="times"><span id="elapsed"></span><span id="duration"></span></div>
		</section>

		<div id="status" class="status" hidden></div>
	</main>

	<script src="script.js"></script>
</body>
</html>
