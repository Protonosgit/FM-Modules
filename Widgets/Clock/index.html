<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clock Widget</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        color: var(--time-color);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .clock {
        width: 100%;
        padding: 0.5rem;
        text-align: center;
      }

      .time {
        font-size: clamp(1.5rem, 12vw, 4.5rem);
        font-weight: 400;
        line-height: 1.1;
        color: var(--time-color);
        white-space: nowrap;
      }

      .blink-dots {
        color: var(--dots-color);
        animation: blink 1s steps(1, end) infinite;
      }

      .date {
        margin-top: 0.25rem;
        font-size: clamp(0.75rem, 3.5vw, 1.25rem);
        color: var(--date-color);
        line-height: 1.2;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="clock" aria-live="polite">
      <div class="time" id="time">00:00:00</div>
      <div class="date" id="date">Monday, January 1, 2024</div>
    </div>

    <script>
      const timeEl = document.getElementById('time');
      const dateEl = document.getElementById('date');

      const defaultParams = {
        hour12: false,
        showSeconds: true,
        showDate: true,
        dateFormat: 'long',
        timezone: 'local',
        timeColor: '#ffffff',
        dateColor: '#aaaaaa',
        dotsColor: '#ffffff'
      };

      let updateTimer;
      let clockParams = { ...defaultParams };

      function isEnabled(value, fallback) {
        if (typeof value === 'boolean') return value;
        if (typeof value === 'string') return value.toLowerCase() === 'true';
        return fallback;
      }

      function normalizeParams(params) {
        const colorOrDefault = (value, fallback) =>
          typeof value === 'string' && value.trim() ? value.trim() : fallback;

        return {
          ...defaultParams,
          ...params,
          hour12: isEnabled(params.hour12, defaultParams.hour12),
          showSeconds: isEnabled(params.showSeconds, defaultParams.showSeconds),
          showDate: isEnabled(params.showDate, defaultParams.showDate),
          timeColor: colorOrDefault(params.timeColor, defaultParams.timeColor),
          dateColor: colorOrDefault(params.dateColor, defaultParams.dateColor),
          dotsColor: colorOrDefault(params.dotsColor, defaultParams.dotsColor)
        };
      }

      function applyColors(params) {
        document.documentElement.style.setProperty('--time-color', params.timeColor);
        document.documentElement.style.setProperty('--date-color', params.dateColor);
        document.documentElement.style.setProperty('--dots-color', params.dotsColor);
      }

      function getTimeFormatter(params) {
        const hour12 = Boolean(params.hour12);
        const showSeconds = Boolean(params.showSeconds);

        return new Intl.DateTimeFormat('en-US', {
          hour: '2-digit',
          minute: '2-digit',
          second: showSeconds ? '2-digit' : undefined,
          hour12,
          timeZone: params.timezone && params.timezone !== 'local' ? params.timezone : undefined
        });
      }

      function getDateFormatter(params) {
        const dateStyles = ['full', 'long', 'medium', 'short'];
        const dateStyle = dateStyles.includes(params.dateFormat) ? params.dateFormat : 'long';

        return new Intl.DateTimeFormat('en-US', {
          dateStyle,
          timeZone: params.timezone && params.timezone !== 'local' ? params.timezone : undefined
        });
      }

      function updateClock(params) {
        const now = new Date();
        const timeFormatter = getTimeFormatter(params);
        const dateFormatter = getDateFormatter(params);

        timeEl.replaceChildren();
        timeFormatter.formatToParts(now).forEach((part) => {
          if (part.type !== 'literal' || !part.value.includes(':')) {
            timeEl.appendChild(document.createTextNode(part.value));
            return;
          }

          const literalParts = part.value.split(':');
          literalParts.forEach((literal, index) => {
            if (literal) timeEl.appendChild(document.createTextNode(literal));
            if (index < literalParts.length - 1) {
              const dots = document.createElement('span');
              dots.className = 'blink-dots';
              dots.textContent = ':';
              timeEl.appendChild(dots);
            }
          });
        });

        if (params.showDate !== false) {
          dateEl.textContent = dateFormatter.format(now);
        } else {
          dateEl.textContent = '';
        }
      }

      function startUpdates() {
        if (updateTimer) return;
        updateClock(clockParams);
        updateTimer = setInterval(() => updateClock(clockParams), 1000);
      }

      function stopUpdates() {
        clearInterval(updateTimer);
        updateTimer = undefined;
      }

      async function init() {
        let params = { ...defaultParams };

        if (window.mirror && typeof window.mirror.native?.getParams === 'function') {
          try {
            params = { ...defaultParams, ...(await window.mirror.native.getParams()) };
          } catch (error) {
            console.warn('Clock widget: failed to read params', error);
          }
        }

        clockParams = normalizeParams(params);
        applyColors(clockParams);
        startUpdates();
      }

      init();

      if (window.mirror && window.mirror.host) {
        window.mirror.host.on('visibility', ({ visible }) => {
          if (visible === false) {
            stopUpdates();
          } else {
            startUpdates();
          }
        });
      }
    </script>
  </body>
</html>
