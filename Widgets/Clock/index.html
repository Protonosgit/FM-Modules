<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clock Widget</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        color: inherit;
        font-family: sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .clock {
        width: 100%;
        text-align: center;
      }

      .time {
        font-size: 3rem;
        font-weight: 400;
      }

      .date {
        margin-top: 0.25rem;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="clock" aria-live="polite">
      <div class="time" id="time">00:00:00</div>
      <div class="date" id="date">Monday, January 1, 2024</div>
    </div>

    <script>
      const timeEl = document.getElementById('time');
      const dateEl = document.getElementById('date');

      const defaultParams = {
        hour12: false,
        showSeconds: true,
        showDate: true,
        dateFormat: 'long',
        timezone: 'local'
      };

      function getTimeFormatter(params) {
        const hour12 = Boolean(params.hour12);
        const showSeconds = Boolean(params.showSeconds);

        return new Intl.DateTimeFormat('en-US', {
          hour: '2-digit',
          minute: '2-digit',
          second: showSeconds ? '2-digit' : undefined,
          hour12,
          timeZone: params.timezone && params.timezone !== 'local' ? params.timezone : undefined
        });
      }

      function getDateFormatter(params) {
        const dateStyles = ['full', 'long', 'medium', 'short'];
        const dateStyle = dateStyles.includes(params.dateFormat) ? params.dateFormat : 'long';

        return new Intl.DateTimeFormat('en-US', {
          dateStyle,
          timeZone: params.timezone && params.timezone !== 'local' ? params.timezone : undefined
        });
      }

      function updateClock(params) {
        const now = new Date();
        const timeFormatter = getTimeFormatter(params);
        const dateFormatter = getDateFormatter(params);

        timeEl.textContent = timeFormatter.format(now);

        if (params.showDate !== false) {
          dateEl.textContent = dateFormatter.format(now);
        } else {
          dateEl.textContent = '';
        }
      }

      async function init() {
        let params = { ...defaultParams };

        if (window.mirror && typeof window.mirror.native?.getParams === 'function') {
          try {
            params = { ...defaultParams, ...(await window.mirror.native.getParams()) };
          } catch (error) {
            console.warn('Clock widget: failed to read params', error);
          }
        }

        updateClock(params);
        setInterval(() => updateClock(params), 1000);
      }

      init();

      if (window.mirror && window.mirror.host) {
        window.mirror.host.on('visibility', ({ visible }) => {
          document.body.style.opacity = visible === false ? '0.5' : '1';
        });
      }
    </script>
  </body>
</html>
