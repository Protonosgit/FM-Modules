<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendar Widget</title>
    <style>
      :root {
        --text: #f4f8f5;
        --muted: rgba(244, 248, 245, 0.62);
        --faint: rgba(244, 248, 245, 0.11);
        --accent: #f3b562;
        --sunday: #e88989;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        color: var(--text);
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .calendar {
        width: min(100%, 28rem);
        padding: clamp(0.35rem, 2.4vw, 1rem);
      }

      .calendar-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        margin: 0 0 clamp(0.6rem, 2vw, 1rem);
        border-bottom: 1px solid var(--faint);
        padding-bottom: 0.55rem;
      }

      .month-header {
        min-width: 0;
        font-size: clamp(1rem, 5vw, 1.45rem);
        font-weight: 400;
        letter-spacing: 0.02em;
        line-height: 1.1;
        overflow: hidden;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .today-label {
        flex: 0 0 auto;
        color: var(--accent);
        font-size: 0.62rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .weekdays,
      .days {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 0.35rem;
      }

      .weekdays {
        margin-bottom: 0.3rem;
      }

      .weekday,
      .day {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: clamp(1.55rem, 7vw, 2.5rem);
        border-radius: 0.25rem;
        font-size: clamp(0.58rem, 2.1vw, 0.72rem);
      }

      .weekday {
        color: var(--muted);
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .day {
        position: relative;
        border: 1px solid transparent;
        color: var(--text);
        font-size: clamp(0.72rem, 3vw, 0.92rem);
        font-variant-numeric: tabular-nums;
      }

      .day.empty {
        background: transparent;
        border-color: transparent;
      }

      .day.sunday {
        color: var(--sunday);
      }

      .day.today {
        border-color: var(--accent);
        color: var(--accent);
        font-weight: 700;
      }

      .day.today::after {
        content: "";
        position: absolute;
        width: 0.28rem;
        height: 0.28rem;
        background: var(--accent);
        border-radius: 50%;
        bottom: 0.2rem;
        left: 50%;
        transform: translateX(-50%);
      }
    </style>
  </head>
  <body>
    <div class="calendar" aria-live="polite">
      <div class="calendar-heading">
        <div class="month-header" id="month-header">Month Year</div>
        <div class="today-label" id="today-label">Today</div>
      </div>
      <div class="weekdays" id="weekdays"></div>
      <div class="days" id="days"></div>
    </div>

    <script>
      const monthHeader = document.getElementById('month-header');
      const todayLabel = document.getElementById('today-label');
      const weekdaysEl = document.getElementById('weekdays');
      const daysEl = document.getElementById('days');

      const defaultParams = {
        first_day_of_week: 0,
        highlight_sunday: true,
        show_month_name: true,
        locale: 'en-US',
        timezone: 'local'
      };

      const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

      async function init() {
        let params = { ...defaultParams };

        if (window.mirror && typeof window.mirror.native?.getParams === 'function') {
          try {
            params = { ...defaultParams, ...(await window.mirror.native.getParams()) };
          } catch (error) {
            console.warn('Calendar widget: failed to read params', error);
          }
        }

        const locale = params.locale || defaultParams.locale;
        const requestedFirstDay = Number(params.first_day_of_week);
        const firstDay = Number.isInteger(requestedFirstDay) && requestedFirstDay >= 0 && requestedFirstDay <= 6
          ? requestedFirstDay
          : defaultParams.first_day_of_week;
        params.timezone = params.timezone && params.timezone !== 'local' ? params.timezone : undefined;
        const orderedWeekdays = [...weekdays.slice(firstDay), ...weekdays.slice(0, firstDay)];

        weekdaysEl.innerHTML = orderedWeekdays
          .map((day) => `<div class="weekday" aria-hidden="true">${day}</div>`)
          .join('');

        renderCalendar(params, locale, firstDay);
        setInterval(() => renderCalendar(params, locale, firstDay), 60000);
      }

      function renderCalendar(params, locale, firstDay) {
        const now = new Date();
        const dateParts = new Intl.DateTimeFormat('en-CA', {
          year: 'numeric',
          month: 'numeric',
          day: 'numeric',
          timeZone: params.timezone
        }).formatToParts(now);
        const year = Number(dateParts.find((part) => part.type === 'year').value);
        const month = Number(dateParts.find((part) => part.type === 'month').value) - 1;
        const today = Number(dateParts.find((part) => part.type === 'day').value);

        const totalDays = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
        const firstWeekdayIndex = new Date(Date.UTC(year, month, 1)).getUTCDay();
        const cells = [];

        const monthLabel = new Intl.DateTimeFormat(locale, {
          month: 'long',
          year: 'numeric',
          timeZone: params.timezone
        }).format(now);

        if (params.show_month_name !== false) {
          monthHeader.textContent = monthLabel;
        } else {
          monthHeader.textContent = '';
        }
        todayLabel.textContent = new Intl.DateTimeFormat(locale, {
          month: 'short',
          day: 'numeric',
          timeZone: params.timezone
        }).format(now);

        const leadingOffset = (firstWeekdayIndex - firstDay + 7) % 7;
        for (let i = 0; i < leadingOffset; i++) {
          cells.push('<div class="day empty"></div>');
        }

        for (let day = 1; day <= totalDays; day++) {
          const weekdayIndex = new Date(Date.UTC(year, month, day)).getUTCDay();
          const isSunday = weekdayIndex === 0;
          const isToday = day === today;

          let className = 'day';
          if (params.highlight_sunday !== false && isSunday) className += ' sunday';
          if (isToday) className += ' today';

          cells.push(`<div class="${className}">${day}</div>`);
        }

        while (cells.length % 7 !== 0) {
          cells.push('<div class="day empty"></div>');
        }

        daysEl.innerHTML = cells.join('');
      }

      init();

      if (window.mirror && window.mirror.host) {
        window.mirror.host.on('visibility', ({ visible }) => {
          document.body.style.opacity = visible === false ? '0.5' : '1';
        });
      }
    </script>
  </body>
</html>
