<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendar Widget</title>
    <style>
      :root {
        --panel: rgba(10, 23, 31, 0.52);
        --panel-border: rgba(149, 228, 255, 0.2);
        --text: #edf7ff;
        --muted: rgba(237, 247, 255, 0.72);
        --grid: rgba(255, 255, 255, 0.08);
        --today: #fbbf24;
        --sunday: rgba(252, 110, 110, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        color: var(--text);
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        overflow: hidden;
      }

      .calendar {
        width: min(100%, 420px);
        padding: 1rem 0.9rem 0.85rem;
        background: linear-gradient(180deg, rgba(10, 25, 34, 0.7), rgba(5, 14, 20, 0.34));
        border: 1px solid var(--panel-border);
        border-radius: 18px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02), 0 0 24px rgba(71, 175, 220, 0.12);
      }

      .month-header {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 0.7rem;
        font-size: 0.95rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .weekdays,
      .days {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 0.35rem;
      }

      .weekdays {
        margin-bottom: 0.4rem;
      }

      .weekday,
      .day {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 2.3rem;
        border-radius: 0.6rem;
        font-size: 0.7rem;
      }

      .weekday {
        color: var(--muted);
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .day {
        position: relative;
        border: 1px solid var(--grid);
        background: rgba(255, 255, 255, 0.02);
        color: var(--text);
      }

      .day.empty {
        background: transparent;
        border-color: transparent;
      }

      .day.sunday {
        background: var(--sunday);
        border-color: rgba(252, 110, 110, 0.25);
      }

      .day.today {
        background: rgba(251, 191, 36, 0.18);
        border-color: rgba(251, 191, 36, 0.8);
        box-shadow: inset 0 0 0 1px rgba(251, 191, 36, 0.8);
      }

      .day.today::after {
        content: "";
        position: absolute;
        width: 0.38rem;
        height: 0.38rem;
        background: var(--today);
        border-radius: 50%;
        bottom: 0.38rem;
        left: 50%;
        transform: translateX(-50%);
      }
    </style>
  </head>
  <body>
    <div class="calendar" aria-live="polite">
      <div class="month-header" id="month-header">Month Year</div>
      <div class="weekdays" id="weekdays"></div>
      <div class="days" id="days"></div>
    </div>

    <script>
      const monthHeader = document.getElementById('month-header');
      const weekdaysEl = document.getElementById('weekdays');
      const daysEl = document.getElementById('days');

      const defaultParams = {
        first_day_of_week: 0,
        highlight_sunday: true,
        show_month_name: true,
        locale: 'en-US',
        timezone: 'local'
      };

      const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

      function getParams() {
        if (window.mirror && typeof window.mirror.native?.getParams === 'function') {
          try {
            return { ...defaultParams, ...(window.mirror.native.getParams ? null : {}) };
          } catch (error) {
            console.warn('Calendar widget: failed to read params', error);
          }
        }
        return { ...defaultParams };
      }

      async function init() {
        let params = { ...defaultParams };

        if (window.mirror && typeof window.mirror.native?.getParams === 'function') {
          try {
            params = { ...defaultParams, ...(await window.mirror.native.getParams()) };
          } catch (error) {
            console.warn('Calendar widget: failed to read params', error);
          }
        }

        const locale = params.locale || defaultParams.locale;
        const firstDay = Number.isInteger(params.first_day_of_week) ? params.first_day_of_week : defaultParams.first_day_of_week;
        const orderedWeekdays = [...weekdays.slice(firstDay), ...weekdays.slice(0, firstDay)];

        weekdaysEl.innerHTML = orderedWeekdays
          .map((day) => `<div class="weekday">${day}</div>`)
          .join('');

        renderCalendar(params, locale, firstDay);
        setInterval(() => renderCalendar(params, locale, firstDay), 60000);
      }

      function renderCalendar(params, locale, firstDay) {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();

        const firstOfMonth = new Date(year, month, 1);
        const lastOfMonth = new Date(year, month + 1, 0);
        const totalDays = lastOfMonth.getDate();
        const firstWeekdayIndex = firstOfMonth.getDay();
        const cells = [];

        const monthLabel = new Intl.DateTimeFormat(locale, {
          month: 'long',
          year: 'numeric',
          timeZone: params.timezone && params.timezone !== 'local' ? params.timezone : undefined
        }).format(now);

        if (params.show_month_name !== false) {
          monthHeader.textContent = monthLabel;
        } else {
          monthHeader.textContent = '';
        }

        const leadingOffset = (firstWeekdayIndex - firstDay + 7) % 7;
        for (let i = 0; i < leadingOffset; i++) {
          cells.push('<div class="day empty"></div>');
        }

        for (let day = 1; day <= totalDays; day++) {
          const date = new Date(year, month, day);
          const isSunday = date.getDay() === 0;
          const isToday = date.toDateString() === now.toDateString();

          let className = 'day';
          if (params.highlight_sunday !== false && isSunday) className += ' sunday';
          if (isToday) className += ' today';

          cells.push(`<div class="${className}">${day}</div>`);
        }

        while (cells.length % 7 !== 0) {
          cells.push('<div class="day empty"></div>');
        }

        daysEl.innerHTML = cells.join('');
      }

      init();

      if (window.mirror && window.mirror.host) {
        window.mirror.host.on('visibility', ({ visible }) => {
          document.body.style.opacity = visible === false ? '0.5' : '1';
        });
      }
    </script>
  </body>
</html>
